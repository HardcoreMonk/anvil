# Demo override for webdev_demo.sh — Google Gemini 2.5 Flash-Lite.
#
# Originally tried gemini-2.0-flash for cost (free-tier quota 0 — dead end),
# then gemini-2.5-flash for share-the-bucket simplicity with the orchestrator.
# After hitting the flash 20 RPM cap during an orchestrator burst, the policy
# is now: keep the orchestrator's quota bucket separate from the reviewer's by
# using lite on the reviewer too. Reviewer only emits a single-line JSON
# verdict so lite is plenty.

GOOSE_PROVIDER: google
GOOSE_MODEL: gemini-2.5-flash-lite
GOOSE_TELEMETRY_ENABLED: false
GOOSE_DISABLE_KEYRING: true

extensions:
  developer:
    bundled: true
    enabled: true
    name: developer
    timeout: 300
    type: builtin
