# webdev_demo.sh role profile — Groq (reviewer).
#
# Emits a single-line JSON verdict only. Runs the fast openai/gpt-oss-20b
# (OpenAI-format tool calls Groq accepts reliably). Sizing: 1 vCPU / 512 MiB
# (Light preset). The API key comes from the global configs/goose-secrets.yaml
# (GROQ_API_KEY).
#
# Override per run with WEBDEV_REVIEWER_MODEL to experiment.
GOOSE_PROVIDER: groq
GOOSE_MODEL: openai/gpt-oss-20b
GOOSE_TELEMETRY_ENABLED: false
GOOSE_DISABLE_KEYRING: true
EPHEMERA_VCPU_COUNT: 1
EPHEMERA_MEM_SIZE_MIB: 512

extensions:
  developer:
    bundled: true
    enabled: true
    name: developer
    timeout: 300
    type: builtin
