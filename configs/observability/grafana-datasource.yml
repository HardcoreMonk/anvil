# Grafana datasource provisioning for the ephemera observability demo.
# Pointed at the Prometheus instance launched by observability_demo.sh
# (http://localhost:9090). The uid is referenced from the dashboard JSON,
# so leave it stable across edits.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus-ephemera
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
