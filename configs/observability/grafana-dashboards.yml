# Grafana dashboards-provider provisioning for the ephemera observability demo.
# Picks up every JSON file under {path} as an auto-imported dashboard.
# observability_demo.sh rewrites {path} at runtime so this file can live in
# the repo at a stable location.

apiVersion: 1

providers:
  - name: ephemera
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards-ephemera
      foldersFromFilesStructure: false
