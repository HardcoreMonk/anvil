name: Release

# Publishes end-user release tarballs to a GitHub Release.
# Run the e2e gate (sudo bash e2e_test.sh) BEFORE tagging — CI cannot (no /dev/kvm).
#
# The trigger used to be 'v*', which never matched: anvil releases are tagged
# anvil-v*, and bare v* is the upstream ephemera runtime namespace this fork
# keeps (see CONTEXT.md, "Fork와 upstream 정책"). The workflow had therefore
# never run once — every release so far was built on a developer machine and
# uploaded by hand — while a future upstream sync pushing a v* tag to origin
# would have fired it and published an anvil release built from an upstream tag.
#
# HAS NEVER RUN ON CI. Validate it with workflow_dispatch on a throwaway tag
# before relying on it for a real release: the FULL variant runs debootstrap and
# produces a ~250 MB asset, and neither has been exercised on a GitHub-hosted
# runner. A failure here does not block anything today, since releases are still
# published by hand.
on:
  push:
    tags:
      - 'anvil-v*'
  # Dispatch takes no inputs on purpose. Select the tag as the run's ref in the
  # UI and GITHUB_REF_NAME carries it, so the version never travels through an
  # interpolated string into a shell or a checkout ref.
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    # Build on the oldest supported host: ephemera-daemon links to this glibc, so
    # building here keeps it runnable on Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # FULL variant bakes the golden image via debootstrap (no /dev/kvm needed —
      # image build is debootstrap + chroot + loop mount, not VM boot).
      - name: Install image-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap util-linux e2fsprogs

      # The Web UI build output is committed (cmd/goose-daemon/uidist, go:embed),
      # so no Node step is required. build_release.sh guards that it is present.
      # FULL bakes the image, which needs root; -E + explicit PATH keeps the Go
      # toolchain and module cache from the non-root setup-go step.
      - name: Build release tarballs (FULL + SLIM)
        run: sudo -E env "PATH=$PATH" bash scripts/build_release.sh "${GITHUB_REF_NAME}"

      # Pinned to a commit, not the moving v2 tag: this step holds contents:write
      # and is the exact shape a retargeted-tag supply-chain attack goes after.
      # Bump deliberately (the SHA below is v2 as of 2026-08-06).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
