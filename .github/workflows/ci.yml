name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Static format gate. Runs after setup-go so it uses the go.mod-pinned
      # toolchain's gofmt (not the runner default), keeping the canonical format
      # tied to the same Go version that builds/tests the code.
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit tests only — integration tests that require /dev/kvm
      # must run on a self-hosted runner with nested virtualization.
      - name: Test
        run: go test ./...
